<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El peso de la Corona: Cataluña, 1626-1641</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece2c8;--card:#f6efdc;--ink:#2a1f14;--mute:#6a5842;--line:#b9a57c;--gold:#8a6420;--red:#8e2a2a;--green:#3f6b3a;--bar:#d8caa6;--seal:#7a1f24;--glow:rgba(138,100,32,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110e;--card:#1e1813;--ink:#ece2cc;--mute:#a89a80;--line:#4b3e2b;--gold:#c09a55;--red:#d0695f;--green:#8fb386;--bar:#2e251c;--seal:#7a1f24;--glow:rgba(192,154,85,.10)}}
:root[data-theme="dark"]{--bg:#15110e;--card:#1e1813;--ink:#ece2cc;--mute:#a89a80;--line:#4b3e2b;--gold:#c09a55;--red:#d0695f;--green:#8fb386;--bar:#2e251c;--seal:#7a1f24;--glow:rgba(192,154,85,.10)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(900px 480px at 50% -120px,var(--glow),transparent 70%),var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;line-height:1.5;font-size:19px}
h1,h2{font-family:"Cinzel",Georgia,serif;font-weight:700;margin:0}
h1{font-size:2rem;line-height:1.15;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
h2{font-size:1.4rem;line-height:1.2;letter-spacing:.03em;margin:4px 0 10px}
p{margin:0 0 12px}
.mute{color:var(--mute);font-size:.92rem}
header{display:flex;justify-content:center;align-items:center;max-width:680px;margin:0 auto;padding:16px 16px 0;font-family:"Cinzel",Georgia,serif;font-size:.74rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
header span::before,header span::after{content:"\25C6";font-size:.45rem;margin:0 .9em;vertical-align:middle}
main{max-width:680px;margin:0 auto;padding:14px 16px 48px}
.card{position:relative;background:var(--card);border:1px solid var(--line);padding:18px 18px 16px;margin-bottom:16px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line)}
.year{display:block;font-family:"Cinzel",Georgia,serif;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.year::after{content:"";display:block;width:52px;height:1px;background:var(--gold);margin-top:6px}
.meters{display:grid;gap:12px;margin:0 0 18px;padding:14px 16px;background:var(--card);border:1px solid var(--line);box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line)}
.m{display:grid;grid-template-columns:1fr 50px;gap:4px 12px;align-items:center;font-size:.92rem}
.m>span:first-child{grid-column:1;grid-row:1;font-family:"Cinzel",Georgia,serif;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.bar{grid-column:1;grid-row:2;position:relative;height:12px;background:var(--bar);border:1px solid var(--line)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--line) calc(25% - 1px) 25%)}
.fill{position:relative;height:100%;background:var(--ink);transition:width .7s ease}
.m:nth-child(1) .fill{background:var(--green)}.m:nth-child(2) .fill{background:var(--gold)}.m:nth-child(3) .fill{background:var(--red)}
.val{grid-column:2;grid-row:1 / span 2;font-family:"Cinzel",Georgia,serif;font-size:1.05rem;text-align:right;font-variant-numeric:tabular-nums}
.d{font-weight:700}.up{color:var(--green)}.dn{color:var(--red)}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);padding:14px 16px;margin-bottom:12px;min-height:60px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line)}
.opt:hover,.opt:focus-visible{border-color:var(--gold);outline:2px solid var(--gold);outline-offset:2px}
.opt>span:not(.chips){flex:1;font-size:1.08rem;line-height:1.35}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--seal);color:#f4e9d0;display:grid;place-items:center;font-family:"Cinzel",Georgia,serif;font-size:.85rem;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--gold)}
.opt small{display:block;margin-top:4px}
.opt.lock{opacity:.6;cursor:not-allowed}
.chips{display:inline-flex;gap:4px;flex:none}
.chip{width:24px;height:24px;border-radius:50%;color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center}
.adv{display:flex;gap:14px;align-items:stretch;margin-bottom:14px}
.pt{width:60px;height:72px;flex:none;overflow:hidden;border:2px solid var(--gold);border-radius:30px 30px 4px 4px;background:var(--card);box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--line)}
.bub{flex:1;background:var(--card);border:1px solid var(--line);padding:10px 14px;font-size:1rem;line-height:1.4}
.bub b{display:block;font-family:"Cinzel",Georgia,serif;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.prog{display:flex;gap:6px;margin-bottom:14px}
.prog i{flex:1;height:3px;background:var(--bar)}.prog i.on{background:var(--gold)}
.card.crisis{border-top:4px solid var(--red)}
.badge{display:inline-block;font-family:"Cinzel",Georgia,serif;font-size:.62rem;letter-spacing:.1em;padding:3px 8px;margin:0 6px 8px 0;text-transform:uppercase}
.hi{background:var(--green);color:var(--bg)}.hy{background:var(--red);color:var(--bg)}.ty{background:var(--bar);color:var(--ink)}
.note{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:0 0 12px;font-size:1rem}
.note b{font-family:"Cinzel",Georgia,serif;font-size:.72rem;letter-spacing:.08em;color:var(--gold)}
.tag{font-weight:700}.best{color:var(--green)}.bad{color:var(--red)}
.score{font-family:"Cinzel",Georgia,serif;font-size:2.8rem;font-weight:700;color:var(--gold);line-height:1}
.rev{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.go{display:block;width:100%;font-family:"Cinzel",Georgia,serif;font-weight:700;font-size:.9rem;letter-spacing:.16em;text-transform:uppercase;background:var(--ink);color:var(--bg);border:1px solid var(--gold);padding:15px 22px;min-height:50px;border-radius:0;box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 4px var(--gold)}
.go:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cover{position:relative;text-align:center;padding:28px 8px 28px;margin:0 -16px;min-height:calc(100vh - 56px);display:flex;flex-direction:column;justify-content:center;background:radial-gradient(640px 400px at 50% 30%,var(--glow),transparent 70%)}
.cover::before,.cover::after{content:"";position:absolute;left:0;right:0;height:30px;background:#0b0907;z-index:1}
.cover::before{top:0}.cover::after{bottom:0}
.cover>*{position:relative;z-index:2}
.cover h1{font-size:2.4rem;margin-bottom:8px}
.royal{position:relative;z-index:2;width:84px;height:102px;margin:0 auto 18px;border:2px solid var(--gold);border-radius:42px 42px 3px 3px;overflow:hidden;box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--gold);opacity:.92}
.cover h1::after{content:"";display:block;width:140px;height:1px;background:var(--gold);margin:16px auto 0;box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--gold)}
.cover>p{letter-spacing:.2em;text-transform:uppercase;font-family:"Cinzel",Georgia,serif;font-size:.78rem;margin-top:14px}
.cover>.card{text-align:left;margin-top:20px}
.cover>.meters{text-align:left}
.cover>.go{margin-top:4px}
@media (min-width:760px){main{max-width:720px}.cover h1{font-size:3rem}}
#app>*{animation:fd .35s ease both}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){#app>*{animation:none}.fill{transition:none}}
</style>
</head>

<header><span>El peso de la Corona</span></header>
<main id="app"></main>
<script>
var NAMES=["Lealtad catalana","Tesoro real","Autoridad regia"];
var R=[
{y:"1626",t:"La Unión de Armas",s:"El conde-duque de Olivares quiere que todos los reinos aporten soldados y dinero para la guerra. Cataluña tiene constituciones propias que limitan lo que el rey puede exigir.",o:[
{l:"Exigir soldados y dinero por decreto.",p:5,d:[-20,15,-5],e:"Un decreto violaba las constituciones: en Cataluña el rey gobernaba con pacto, no por mandato. Se ganó dinero a corto plazo y se perdió confianza."},
{l:"Convocar Cortes y negociar una contribución.",p:25,d:[5,5,5],e:"Es la lógica del Estado Compuesto: el rey pide, el reino concede y las leyes propias se respetan."},
{l:"Renunciar y pedírselo todo a Castilla.",p:15,d:[10,-10,-5],e:"Cataluña queda tranquila, pero Castilla carga con todo el peso y la Corona se queda sin recursos."}]},
{y:"1626",t:"Cortes estancadas",s:"Los catalanes ofrecen pagar solo si el rey confirma sus privilegios y reparte cargos entre su élite. El tiempo apremia.",o:[
{l:"Cerrar las Cortes y cobrar por otras vías.",p:5,d:[-15,10,-5],e:"Las Cortes de 1626 terminaron sin acuerdo. La Corona obtuvo algo, pero la desconfianza quedó sembrada."},
{l:"Dar cargos y mercedes a cambio de un subsidio.",p:25,d:[10,5,5],e:"Intercambiar mercedes por servicios era la forma habitual de pactar con las élites del reino."},
{l:"Ceder todo sin pedir nada.",p:15,d:[10,-5,-10],e:"Se gana afecto, pero el rey debilita su autoridad sin obtener recursos a cambio."}]},
{y:"1635-1639",t:"La guerra con Francia",s:"Cataluña es frontera de guerra. Los soldados del rey llegan y necesitan dónde alojarse y qué comer.",o:[
{l:"Alojar a las tropas en casas particulares, sin pagar.",p:5,d:[-20,10,-5],e:"Los alojamientos forzosos provocaron abusos y odio hacia los soldados. La población dejó de ver al ejército como suyo."},
{l:"Respetar las constituciones, pagar y mantener la disciplina.",p:25,d:[10,-5,10],e:"Cuesta más, pero la Corona conserva su legitimidad y su autoridad se apoya en la ley."},
{l:"Levantar tropas catalanas con mandos catalanes.",p:15,d:[10,-5,-5],e:"Da confianza al reino, aunque el rey pierde parte del control militar."}]},
{y:"1640",t:"El Corpus de Sangre",s:"Segadores sublevados asesinan al virrey en Barcelona. La Diputación del General dirige la protesta y el reino está en tensión.",o:[
{l:"Reprimir militarmente la revuelta.",p:5,d:[-30,-15,-10],e:"La represión empujó a la Diputación hacia la protección de Francia. Fue el camino hacia la separación."},
{l:"Negociar con la Diputación y retirar las tropas.",p:25,d:[15,-5,5],e:"Abre una salida pactada: la Corona cede en lo militar, pero mantiene al reino dentro de la monarquía."},
{l:"Dar un perdón general sin condiciones.",p:15,d:[10,0,-15],e:"Calma los ánimos, pero deja a la Corona sin autoridad para volver a exigir nada."}]},
{y:"1639-1640",t:"La caída de Salses",s:"Los franceses han tomado la fortaleza de Salses, en el Rosellón. La Corona necesita soldados deprisa y Cataluña duda.",o:[
{l:"Reclutar por la fuerza en las poblaciones.",p:5,d:[-20,5,-5],t:-1,e:"Es barato y rápido, pero viola las constituciones y deja rencor."},
{l:"Pedir a la Generalitat que levante y pague tropas.",p:25,d:[5,-5,5],t:1,n:1,e:"El reino se implica en su propia defensa y el pacto se mantiene, aunque la Corona controla menos."},
{l:"Traer tropas de otros territorios, pagadas por la Corona.",p:15,d:[-10,-15,10],m:1,e:"Es eficaz, pero muy caro, y soldados de fuera tensan al reino."}]},
{y:"1640",t:"Los abusos de las tropas",s:"El ejército sigue en Cataluña y los incidentes se multiplican: saqueos, incendios, muertes. Alguien debe responder.",o:[
{l:"Castigar a los pueblos para imponer disciplina.",p:5,d:[-25,5,5],t:-2,e:"Se refuerza la obediencia a corto plazo, pero se castiga a las víctimas."},
{l:"Investigar a los soldados culpables y pagar los daños.",p:25,d:[10,-10,0],t:1,n:1,e:"Responde al agravio y repara la confianza, aunque cuesta dinero y molesta al ejército."},
{l:"Alejar a las tropas a cuarteles fuera de Cataluña.",p:15,d:[5,-10,-10],m:1,e:"Calma los pueblos, pero deja la frontera menos protegida y sin culpables."}]},
{y:"Primavera de 1640",t:"El arresto de Tamarit",s:"El virrey ha encarcelado a Francesc de Tamarit, diputado de la Generalitat. Campesinos se acercan a Barcelona para liberarlo.",o:[
{l:"Mantenerlo preso y reforzar la guardia.",p:5,d:[-20,0,5],t:-1,e:"La Corona muestra firmeza, pero convierte a un diputado en símbolo."},
{l:"Liberarlo y abrir negociaciones con la Diputación.",p:25,d:[10,-5,-10],t:1,n:1,e:"Cede autoridad inmediata para rebajar la tensión y reabrir el diálogo."},
{l:"Trasladarlo en secreto fuera de la ciudad.",p:15,d:[-5,0,-5],e:"Evita el tumulto inmediato, pero parece un secuestro."}]},
{y:"Verano de 1640",t:"La crisis tras el Corpus",s:"El virrey ha muerto. La Generalitat, presidida por Pau Claris, pide retirar las tropas, y en Madrid se debate cómo responder.",o:[
{l:"Preparar un ejército para restaurar la autoridad.",p:5,d:[-20,-10,10],t:-1,e:"Impone respeto, pero confirma los temores de una invasión."},
{l:"Negociar con la Diputación y suspender los alojamientos.",p:25,d:[10,-5,0],t:1,n:1,e:"Abre una salida pactada, aunque parece debilidad ante el asesinato del virrey."},
{l:"Ofrecer cargos y mercedes a los sectores moderados.",p:15,d:[0,-10,5],m:1,e:"Intenta dividir a la élite catalana, pero cuesta dinero y puede parecer soborno."}]},
{y:"Otoño de 1640",t:"El pacto con Francia",s:"La Generalitat busca ayuda militar en Francia. La Corona aún puede intentar evitar la alianza.",o:[
{l:"Declarar traidores a los diputados y cerrar toda negociación.",p:5,d:[-20,-5,10],t:-1,e:"Es una respuesta dura que deja a los moderados sin salida."},
{l:"Ofrecer perdón y confirmar las constituciones.",p:25,d:[15,-10,-5],t:1,n:1,e:"Cede mucho, pero disputa a Francia la iniciativa política."},
{l:"Cerrar pasos y puertos para impedir la alianza.",p:15,d:[-10,-10,10],m:1,e:"Gana tiempo, pero cuesta recursos y aísla aún más al reino."}]},
{y:"Enero de 1641",t:"La ruptura",s:"Cataluña se proclama bajo protección francesa y un ejército real avanza sobre Barcelona.",o:[
{l:"Atacar de inmediato para recuperar Barcelona.",p:5,d:[-15,-15,5],t:-1,e:"Apuesta todo a una victoria rápida y arriesga la derrota."},
{l:"Defender las plazas del sur y ofrecer amnistía a quien vuelva a la obediencia.",p:25,d:[10,-5,5],t:1,n:1,e:"Limita la guerra y deja abierta la reconciliación."},
{l:"Mantener guarniciones y esperar refuerzos de Castilla.",p:15,d:[0,-10,-5],m:1,e:"Evita una ofensiva costosa, pero cede la iniciativa."}]}];
var F=[
{n:"Monarquía unida",c:"var(--green)",x:"Tus decisiones respetaron el pacto entre el rey y el reino. Eso es el Estado Compuesto: varios reinos bajo un mismo monarca, cada uno con sus leyes e instituciones. La unión duró porque se negoció, no porque se impuso."},
{n:"Unión frágil",c:"var(--gold)",x:"Cataluña se queda, pero con desconfianza. Hubo decisiones que tensaron el pacto, y cada crisis futura volverá a poner a prueba la unión."},
{n:"Revuelta general",c:"var(--red)",x:"Cedes tanto o gobiernas tan mal que la Corona se queda sin dinero ni autoridad. Otros reinos y nobles ven la debilidad y se alzan. Un Estado Compuesto no sobrevive solo con concesiones."},
{n:"Separación",c:"var(--red)",x:"Imponer sin pactar rompió la monarquía: Cataluña buscó la protección de Francia, como ocurrió entre 1640 y 1641. Portugal también se alzó en 1640."}];

o de ella.</p><p>Vas a tomar 10 decisiones entre 1626 y 1641. Cada una mueve tres medidores que empiezan en 50. Al final sabrás qué tan bien conservaste el pacto con el reino.</p><p class="mute">Tus consejeros recomiendan según sus intereses, no según la verdad. Sus diálogos son ilustrativos. Entre algunas rondas aparecen cartas de crisis, marcadas como «hecho histórico» o «evento hipotético».</p></div>'+bars(S.m)+'<button class="go" id="b">Comenzar</button></section>';document.getElementById("b").onclick=round}

app.innerHTML='<p class="mute">Puntuación final</p><div class="score">'+s+'<span class="mute" style="font-size:1rem"> / 250</span></div><h1 style="color:'+f.c+';margin-top:10px">'+f.n+'</h1><div class="card"><p>'+f.x+'</p>'+(dg?'<p class="mute">Tu puntuación llegaba a «Monarquía unida», pero la Lealtad o la Autoridad finales eran demasiado bajas para una unión plena.</p>':'')+'</div>'+bars(S.m)+'<h2>Tus decisiones</h2>'+S.pk.map(function(p){var b=p.r.o.filter(function(o){return o.p==25})[0];var ok=p.o.p==25;return '<div class="card"><span class="year">'+p.r.y+'</span> <b>'+p.r.t+'</b><p style="margin-top:6px">Tu decisión <span class="'+(ok?'best':'bad')+'">('+p.o.p+' pts)</span>: '+p.o.l+'</p><p class="mute">Efecto: '+fx(p.o.d)+'. Lo respaldó: '+backers(p.ri,p.o.k)+'.'+(p.n.length?' Consecuencias acumuladas: '+p.n.join(' '):'')+'</p>'+(ok?'':'<div class="rev"><p class="best tag">La más equilibrada (25 pts): '+b.l+'</p><p class="mute">'+b.e+'</p></div>')+'</div>'}).join("")+cardsHtml()+seedHtml();window.scrollTo(0,0)}
